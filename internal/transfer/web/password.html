<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0c">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Vault</title>
<link rel="stylesheet" href="/t/transfer.css">
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="mark">▣</span> VAULT</div>
    <h1>SHARED WITH YOU</h1>
    <p class="sub">This link needs a password.</p>
  </header>
  <form method="post" action="/s/{{.Token}}/unlock" class="unlock">
    <label for="pw" class="muted small">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <button class="primary" type="submit">Open</button>
  </form>
</main>
</body>
</html>
